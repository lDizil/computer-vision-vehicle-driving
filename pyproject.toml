[build-system]
requires = ["setuptools==65.5.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-drive"
version = "0.1.0"
description = "Trajectory contracts for Fast-Slow autonomous driving experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]
