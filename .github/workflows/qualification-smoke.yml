name: Controlled visual Slow qualification

on:
  pull_request:
    paths:
      - '.github/workflows/qualification-smoke.yml'
      - 'Dockerfile'
      - 'Dockerfile.slow'
      - 'requirements/**'
      - 'src/hybrid_drive/qualification/**'
      - 'src/hybrid_drive/geometry/**'
      - 'src/hybrid_drive/slow/**'
      - 'src/hybrid_drive/assets/slow*.py'
      - 'scripts/run_slow_qualification.py'
      - 'scripts/prepare_slow_sample.py'
      - 'scripts/smolvlm*-sources.json'
      - 'scripts/qwen3vl-2b-sources.json'
      - 'tests/unit/test_slow_registry.py'
      - 'tests/unit/test_qualification*'
      - 'tests/unit/test_camera_projection.py'
      - 'tests/unit/test_worker_macos.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  controlled-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build compatible pinned CPU runtime
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p "$RUNNER_TEMP/qualification-results"
          docker build -t hybrid-drive:cpu .
          docker build --cpu-period 100000 --cpu-quota 100000 --memory 2g --memory-swap 2g \
            -f Dockerfile.slow -t hybrid-drive:qualification .
      - name: Require all dataset-free unit and native smoke tests
        run: |
          docker run --rm --init --cpus 1 --memory 2g --memory-swap 2g --network none \
            hybrid-drive:qualification 2>&1 | tee "$RUNNER_TEMP/qualification-results/unit-smoke.log"
      - name: Prepare both pinned text models and matching vision projectors
        run: |
          for variant in 256m 500m; do
            mkdir -p "$RUNNER_TEMP/qualification-assets/smolvlm-$variant"
            docker run --rm --cpus 1 --memory 512m --memory-swap 512m --user "$(id -u):$(id -g)" \
              -v "$RUNNER_TEMP/qualification-assets/smolvlm-$variant:/assets" \
              hybrid-drive:qualification python -m scripts.prepare_slow_sample \
              --root /assets --variant "$variant" --rate-limit-mib 16
          done
      - name: Execute real matched-input CPU diagnostics for both models
        run: |
          docker run --rm --init --cpus 1 --memory 2g --memory-swap 2g --network none \
            --user "$(id -u):$(id -g)" --env HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/qualification-assets:/assets:ro" \
            -v "$RUNNER_TEMP/qualification-results:/results" \
            hybrid-drive:qualification python -m scripts.run_slow_qualification \
            --assets-root /assets --output-root /results --models 256m 500m \
            --case-ids q00 q01 q08 --threads 1 --deadline-seconds 120 --revision "$SOURCE_REVISION" \
            2>&1 | tee "$RUNNER_TEMP/qualification-results/qualification.log"
      - name: Exercise the real two-stage projected protocol on the pinned CPU baseline
        run: |
          docker run --rm --init --cpus 1 --memory 2g --memory-swap 2g --network none \
            --user "$(id -u):$(id -g)" --env HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/qualification-assets:/assets:ro" \
            -v "$RUNNER_TEMP/qualification-results:/results" \
            hybrid-drive:qualification python -m scripts.run_slow_qualification \
            --assets-root /assets --output-root /results/grounded-smoke --models 256m \
            --profile grounded-v1 --case-ids q00 q08 --threads 1 --max-tokens 256 \
            --deadline-seconds 120 --revision "$SOURCE_REVISION" \
            2>&1 | tee "$RUNNER_TEMP/qualification-results/grounded-smoke.log"
      - name: Save diagnostic reports, never model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-qualification-results
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/qualification-results/**/*.json
            ${{ runner.temp }}/qualification-results/**/*.html
            ${{ runner.temp }}/qualification-results/**/*.txt
            ${{ runner.temp }}/qualification-results/**/*.log
            ${{ runner.temp }}/qualification-assets/**/smolvlm-manifest.json
